openapi: 3.0.3
info:
  title: FixNearby API Documentation
  version: 1.0.0
  description: API endpoints schema spec for hyperlocal worker discovery.
paths:
  /api/health:
    get:
      summary: Get Server Health Status
      responses:
        '200':
          description: Server running status
  /api/auth/login:
    post:
      summary: User Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Success token return
